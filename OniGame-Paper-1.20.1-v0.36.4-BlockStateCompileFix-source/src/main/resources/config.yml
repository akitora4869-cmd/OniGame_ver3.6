minimum-players: 1
# v0.25.0: 通常試合は不足人数をぷれいやーBotで補うため、実参加者1人から開始可能です。
game-seconds: 1080
start-title:
  # リソースパックv11の「鬼げぇむ」ロゴをゲーム開始時に表示します。
  enabled: true
  fade-in-ticks: 10
  stay-ticks: 50
  fade-out-ticks: 20
heart-material: CRYING_OBSIDIAN
heart-max-health: 115
heart-progress-per-interval: 1
heart-progress-interval-ticks: 14
heart-group-scaling:
  # 鬼側有利調整: 同じ心臓への集中損傷は強めに逓減する。
  # 合計効率は 1人=1.00倍 / 2人=1.60倍 / 3人=1.86倍 / 4人=2.08倍 / 5人=2.25倍程度。
  player-1: 1.00
  player-2: 0.80
  player-3: 0.62
  player-4: 0.52
  player-5-plus: 0.45
passive-skills:
  # 「強靭」装備時の最大体力（体力2.0でハート1個）。
  durability-max-health: 30
  # 「退魔」の心臓損壊進行倍率。1.15で通常より15%高速になります。
  exorcism-heart-progress-multiplier: 1.10
  practiced-heart-progress-step: 0.025
  practiced-heart-progress-max: 0.10
  desperate-heart-progress-multiplier: 1.20
  # 「賭け金二倍」: GREAT成功ごとに、その判定の追加損傷ボーナスを積み上げる。
  # 失敗・通常成功・中断で連続成功数はリセット。
  double-stakes-great-bonus-step: 2
  double-stakes-great-bonus-max-extra: 10
  # 「臆病」発動中の基礎歩行速度。0.58でスニーク実効速度が通常歩行より少し遅くなります。
  cowardice-sneak-walk-speed: 0.58
  # 「忍びの血統」の常時歩行速度。鬼の標準0.24より少し遅い0.23です。
  ninja-blood-walk-speed: 0.23
  # 「跳躍」はスペース2回押しで前方へ跳びます。
  leap-cooldown-seconds: 10
  leap-forward-velocity: 1.25
  leap-upward-velocity: 0.85
  # EX「字九字ひろ」パッシブ 神技
  divine-technique-walk-speed: 0.21
  divine-technique-attack-multiplier: 1.10
  divine-technique-damage-taken-multiplier: 0.90
technical-passives:
  parry-window-millis: 320
  parry-cooldown-seconds: 20
  parry-damage-multiplier: 0.50
  parry-stamina-cost: 4.0
  quick-turn-cooldown-seconds: 12
  quick-turn-velocity: 0.90
  silent-breath-charge-millis: 2000
  last-reserve-threshold: 3.0
  last-reserve-recovery: 5.0
  last-reserve-cooldown-seconds: 25
  decoy-duration-seconds: 6
  decoy-cooldown-seconds: 10
  cornered-rat-window-millis: 550
  cornered-rat-cooldown-seconds: 18
  cornered-rat-speed-ticks: 45
heart-alert-cooldown-seconds: 5.0
skill-check-min-seconds: 4.0
skill-check-max-seconds: 9.0
skill-check-duration-seconds: 2.4
skill-check-success-window-seconds: 0.34
# 中央の金色判定。通常成功より狭い代わりに進行ボーナスが大きくなります。
skill-check-great-window-seconds: 0.10
skill-check-success-bonus: 2
skill-check-great-bonus: 5
skill-check-failure-penalty: 10
heart-placement-mode: random
random-heart-count: 5
heart-marker-name: "鬼の心臓地点"
exit-radius: 3.0
friendly-fire: false
player-walk-speed: 0.20
oni-walk-speed: 0.255
oni-heart-protection:
  # 鬼側有利調整: 心臓が1個以上残っている間、受けるダメージを20%にします。
  damage-taken-multiplier: 0.20
  # 1秒あたりの自動回復量（体力1.0 = ハート半個）。
  regeneration-per-second: 1.25
oni-passive-skills:
  footstep-hunter-extra-range: 6.0
  scent-trail-seconds: 8
  hunters-instinct-idle-seconds: 8
  hunters-instinct-interval-seconds: 12
  obsession-reacquire-seconds: 20
  obsession-speed-ticks: 50
  beast-path-speed-ticks: 50
  ambush-idle-seconds: 10
  ambush-speed-ticks: 70
  pressure-radius: 3.5
  last-fortress-heart-threshold: 2
  hunting-ground-seconds: 6
  heart-break-effect-radius: 8.0
  cursed-vein-ticks: 80
  homing-speed-ticks: 80
  territory-radius: 8.0
  territory-cooldown-multiplier: 0.80
  blood-frenzy-window-millis: 3500
  blood-frenzy-damage-step: 0.05
  finisher-health-ratio: 0.40
  finisher-speed-ticks: 45
  skill-seal-millis: 1500
  blood-mark-cooldown-recovery-millis: 6000
  mastery-cooldown-multiplier: 0.82
  momentum-stamina-recovery: 2.5
  anchor-knockback-resistance: 0.40
  pulse-speed-ticks: 90
  pulse-speed-amplifier: 0
  execution-damage-multiplier: 1.20
  # 「渇望」は追跡継続5秒ごとに加速し、標準では最大Speed IIです。
  craving-step-seconds: 4
  craving-max-amplifier: 1
  # 「血嗅」は最大体力80%以下の獲物を8秒ごとに2.5秒間発光させます。
  blood-scent-interval-seconds: 8
  blood-scent-health-ratio: 0.80
  blood-scent-glow-ticks: 50
  # 「守護」は心臓損壊通知の間隔を半分にします。
  guardian-alert-interval-multiplier: 0.50
  # 「捕食」は各獲物が初めて瀕死になった時にスタミナを回復します。
  predation-stamina-recovery: 6.0
  # 「妨害」は成功判定幅を35%狭め、通常成功時に損壊進行を3後退させます。
  interference-window-multiplier: 0.65
  interference-normal-regression: 3
  interference-bot-success-multiplier: 0.75
stamina:
  # 満腹度20をスタミナ最大値として使用します。
  drain-per-second: 2.0
  recovery-per-second: 1.5
  sneak-recovery-per-second: 2.5
  # 走りながらジャンプした瞬間に追加消費します。
  dash-jump-cost: 5.0
  dash-jump-slow-ticks: 20
auto-step:
  # 鬼・ぷれいやーがジャンプせず1ブロック段差を登れます。
  enabled: true
  probe-distance: 0.45
healing:
  skill-duration-seconds: 5.5
  skill-amount: 8.0
  item-duration-seconds: 9.0
  item-amount: 5.0
  move-tolerance: 0.45
  # パッシブ「絆」の共有回復。1.0なら治療した本人と同じ量を回復します。
  bond-radius: 6.0
  bond-shared-heal-multiplier: 1.0
skills:
  # EX「字九字ひろ」メイン 武芸
  bugei:
    target-range: 18.0
    launch-upward-velocity: 1.05
    dive-speed: 1.75
    impact-distance: 2.2
    sealed-damage: 10.0
    final-damage: 18.0
    knockback: 1.35
    max-dive-ticks: 32
    final-boost-distance: 5.0
    final-boost-multiplier: 1.35
    trail-density: 10
    impact-ring-particles: 42
    # 武芸の中央スロット演出。抽選ではなく、必ず「跳躍 → 武芸 → キック」で停止する。
    slot-step-ticks: 4
  # 疾走: 5秒間の速度上昇III（Potion amplifier 2）
  sprint-duration-ticks: 100
  sprint-amplifier: 2
  # 安定着地: 落下ダメージ無効後、4秒間の速度上昇III
  safe-landing-speed-ticks: 80
  safe-landing-speed-amplifier: 2
  # メインスキル「執念」で自分と鬼が発光する秒数。
  obsession-glow-seconds: 8
dakko-skills:
  clone:
    # 分霊: 本体と同じ見た目の弱体化堕狐鬼Botを短時間召喚。
    duration-seconds: 6
    spawn-count: 2
    max-active: 2
    health-ratio: 0.40
    attack-ratio: 0.45
    movement-ratio: 0.85
    attack-cooldown-ticks: 22
    bot-cooldown-seconds: 32
    unlock-after-broken-hearts: 1
  fox-fire:
    cooldown-seconds: 25
    radius: 7.0
    fixed-damage: 6.0
    fire-ticks: 100
    unlock-after-broken-hearts: 2
  heavenly-arrival:
    cooldown-seconds: 32
    target-range: 24
    launch-height: 10.0
    impact-radius: 5.0
    impact-damage: 8.0
    unlock-after-broken-hearts: 3
kishin-skills:
  slam:
    unlock-after-broken-hearts: 1
  # 鬼吼: 周囲へ低威力の衝撃波＋追跡を助ける妨害。
  roar:
    cooldown-seconds: 28
    radius: 8.0
    fixed-damage: 5.0
    slowness-ticks: 70
    weakness-ticks: 80
    knockback: 0.65
    unlock-after-broken-hearts: 2
  # 剛身: 短時間だけ耐久・追跡・攻撃性能をまとめて強化する。
  iron-body:
    cooldown-seconds: 32
    duration-ticks: 120
    # 人間鬼はStrength II、鬼Botはこの倍率で通常攻撃を強化。
    attack-damage-multiplier: 1.40
    unlock-after-broken-hearts: 3
random-loot-chest-count: 5
arena-setup:
  # /og arenasetup を実行した地点を中心に、通常試合用の200x200区域を一括設定。
  enabled: false
  size: 200
  heart-candidate-count: 16
  world-border-enabled: true
  world-border-warning-distance: 8

test-arena:
  # 参加者0人で開始したテストプレイ専用。コマンド実行地点を中心にした正方形です。
  size: 200
  heart-count: 5
  loot-chest-count: 5
  world-border-enabled: true
  world-border-warning-distance: 8
exit-beacon:
  # 全心臓破壊後、脱出地点から空へビーコン風の光柱を表示します。
  enabled: true
  height: 80
  particle-step: 0.5
  dust-size: 2.2
heart-proximity-particles:
  # 未破壊の心臓へ近づいたぷれいやーだけに、心臓上の目印を表示します。
  enabled: true
  radius: 18.0
oni-heart-awareness:
  enabled: true
  particle-count: 18
  particle-size: 1.8
player-lives:
  # 人間ぷれいやー・ぷれいやーBotは1回だけ致死ダメージを耐え、完全透明化して逃走できる。
  enabled: true
  escape-duration-ticks: 160
  escape-speed-amplifier: 4
  revive-health-ratio: 0.35

player-hit-grace:
  enabled: true
  duration-ticks: 50
  speed-amplifier: 1
loot-chests:
  open-seconds: 6.0
  move-tolerance: 0.55
  min-items: 1
  max-items: 3
  max-carried-items: 3
  # 装備品はこの上限に含めず、チェスト下段から別抽選します。
  min-equipment: 1
  max-equipment: 1
safety-rescue:
  # 鬼・ぷれいやー・全Bot共通の詰み救済。
  enabled: true
  auto-bots: true
  auto-players-when-embedded: true
  search-radius: 12
  vertical-search: 6
  bot-stuck-checks: 10
  # 手動救済は「本当に脱出不能」と判定された時だけ許可。
  cooldown-seconds: 180
  player-command-enabled: true
  deny-while-chased: true
  deny-near-oni-radius: 18.0
  deny-after-combat-seconds: 12
  require-no-escape-space: true
  # 不正/不要な連打を検知し、一時ロックする。
  abuse-window-seconds: 120
  abuse-attempt-limit: 3
  abuse-lock-seconds: 600
  notify-ops-on-lock: true

bot:
  movement-speed: 0.34
  attack-damage: 8.0
  # 鬼Botが同じZombie系エンティティのぷれいやーBotも確実に追跡・攻撃する補助制御
  player-bot-chase-velocity: 0.30
  player-bot-attack-range: 2.5
  player-bot-attack-cooldown-ticks: 18
  rest-seconds: 2.5
  dakko-heavenly-min-range: 8.0
  dakko-heavenly-max-range: 24.0
  dakko-heavenly-windup-ticks: 12
  hunter-ai:
    enabled: true
    # 上位ぷれいやーAIに合わせた鬼Botの判断補助。
    target-heart-worker-bonus: 8.0
    target-injured-bonus: 7.0
    target-human-bonus: 2.5
    target-friendly-npc-bonus: 5.0
    target-distance-weight: 1.0
    retarget-hysteresis: 3.0
    heart-defense-radius: 16.0
    heart-defense-bonus: 6.0
    skill-save-health-ratio: 0.45
    prediction-seconds: 0.65
    prediction-max-distance: 3.5
    final-target-bonus: 5.0
    human-oni-heart-alert-speed-ticks: 50
    human-oni-heart-alert-speed-amplifier: 0
friendly-npc:
  # ゲーム開始前に /og ally <preset> で設定。空文字で無効。
  preset: ""
  elite-ai:
    enabled: true
    think-radius: 20.0
    danger-radius: 12.0
    intercept-radius: 10.0
    support-health-ratio: 0.70
    medic-follow-distance: 4.5
    safe-heart-player-penalty: 110.0
    safe-heart-bot-penalty: 75.0
    safe-heart-oni-distance-weight: 1.8
    movement-multiplier: 1.12
    chase-movement-multiplier: 1.18
    rion-blink-distance: 4.0
    rion-blink-trigger-radius: 10.0
    iona-decoy-distance: 10.0
    iona-decoy-duration-seconds: 8
    iona-decoy-cooldown-seconds: 18

player-bot:
  # 心臓損傷速度を人間側の調整に合わせて少し抑える。
  heart-progress-multiplier: 0.80
  # v0.25.0: 通常試合でもぷれいやー陣営がこの人数に満たない場合、不足分をBotで自動補充します。
  # 例: 実参加3人 -> 1人が鬼、残る2人＋Bot3体でぷれいやー陣営5人。
  auto-fill-enabled: true
  auto-fill-target: 5
  # 鬼側Bot戦の標準人数。
  default-count: 5
  solo-player-test-teammates: 4
  # Paperの経路探索で使用するZombie本体の基礎移動速度
  pathfinder-base-movement-speed: 0.25
  flee-radius: 10.0
  move-step: 0.65
  flee-step: 0.85
  movement:
    # 滑らかな操舵、障害物回避、Bot同士の分散、1ブロック段差の乗り越え
    max-velocity: 0.28
    step-to-velocity: 0.36
    steering-smoothing: 0.42
    separation-radius: 2.2
    separation-strength: 0.8
    shared-heart-penalty: 64.0
    flee-strafe: 3.0
    stuck-updates-before-jump: 3
    # 0.5秒間隔でこの回数動けなければ、近くの安全な床へ復帰します。
    stuck-updates-before-recovery: 12
    jump-velocity: 0.42
  # 全心臓破壊後、体力に余裕があり、味方が2体以上または鬼が弱っていれば討伐を狙います。
  hunt-min-health-ratio: 0.60
  hunt-min-allies: 2
  hunt-oni-max-health-ratio: 0.50
  hunt-step: 0.78
  hunt-attack-range: 2.4
  hunt-attack-damage: 3.5
  hunt-attack-cooldown-ticks: 20
  skill-check-success-chance: 0.72
  skill-check-great-chance: 0.12
  skill-check-reaction-seconds: 0.65
  stamina-empty-step-multiplier: 0.55
  passives:
    # 臆病Botが鬼から逃げる際の移動補正
    cowardice-flee-step-multiplier: 1.08
    # 集中Botのスキルチェック成功率・グレイト率加算
    focus-skill-check-bonus: 0.08
    focus-great-bonus: 0.05
  skills:
oni-terror-radius: 28.0
oni-detection-range: 24.0
oni-field-of-view: 110.0
chase-lost-seconds: 8.0
oni-sound-visualizer:
  # 鬼プレイヤーに足音などの相対方向を8方向HUDと足元の導線で表示します。
  enabled: true
  radius: 52
test-heart-target-range: 20
final-crimson:
  enabled: true
  remaining-seconds: 180
  # 12000付近は夕焼け。プレイヤー個別時間を固定して空を赤く見せる。
  player-time: 12000
  red-haze-particles: true
  red-haze-count: 42
  red-haze-height: 16.0
  blood-sky:
    # v0.34.6以降はOptiFine Custom Skyを主方式にするため、旧HUD疑似空は標準OFF。
    enabled: false
    font: "onigame:final_sky"
    glyph: ""
    delay-ticks: 80
    fade-in-ticks: 4
    stay-ticks: 3700
    fade-out-ticks: 10
    force-downfall: true
    # OptiFine Custom Sky v23 は player-time=12000(18:00) + rain/thunder で発動。
    # 通常時の誤発動を避けるため、最終フェーズではこの時間・天候の組み合わせを維持する。
    optifine-custom-sky: true
    # 旧HUD方式を再利用したい場合のみ blood-sky.enabled を true にする。
    intensity: 1.35

final-phase-bgm:
  enabled: true
  # 全心臓破壊後は追跡状態に関係なく、全員へ「祟り」を流し続ける。
  sound: "onigame:chase_tatari"
  volume: 0.22
  pitch: 1.0
  replay-seconds: 271

# v0.24.0 物資箱装備
equipment:
  shinai-damage: 3.0
  iron-bat-damage: 5.0
  flare-gun-cooldown-seconds: 15
  flare-gun-reveal-radius: 8.0
  flare-gun-glow-seconds: 5

# v0.26.0: /og forceoni で設定されたUUIDは forced-oni-uuid に保存されます。
# 鬼指定ブロックは locations.oni-selector-block に自動保存されます。

lobby-practice:
  # /og practicechest と /og practiceheart で登録します。
  # 練習設備は GameState.WAITING（ロビー中）だけ使用できます。
  enabled: true

training:
  enabled: true
  # ロビー練習エリア内のみ、メイン/鬼スキルのクールタイムをこの秒数に短縮します。
  cooldown-seconds: 1
  show-actionbar-log: true

