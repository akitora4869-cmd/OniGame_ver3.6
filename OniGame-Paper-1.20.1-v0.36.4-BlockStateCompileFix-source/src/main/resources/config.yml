  armor: 12.0
  guard-ai:
    protect-detection-radius: 16.0
    intercept-distance: 3.0
    follow-distance: 4.5
    melee-range: 2.8
    melee-damage: 7.0
    melee-cooldown-ticks: 18
    fight-seconds: 14.0
    escape-seconds: 2.0
    taunt-seconds: 8.0
    low-health-ratio: 0.15
    escape-distance: 10.0
    leap-cooldown-ticks: 24
    leap-horizontal-speed: 0.95
    leap-upward-velocity: 0.72
    aggro-glow-ticks: 30
    out-of-combat-regen-delay-seconds: 3.0
    out-of-combat-regen-per-second: 8.0

jakutsuki-hearts:
  real-count: 8
  fake-count: 4
  fake-trigger-radius: 3.0
  fake-explosion-radius: 4.5
  fake-damage: 7.0
  fake-glow-ticks: 160

jakutsuki-final:
  # 全ての本物心臓を破壊した時、ぷれいやー陣営へ配布される対蛇窟姫武器。
  snake-slash-damage: 10.0
  # 蛇斬を持ったぷれいやーBotは脱出より討伐を最優先する。
  bot-hunt-step: 0.92
