jakutsuki-stats:
  max-health: 200.0
  max-health-loss-per-heart: 10.0

jakutsuki-skills:
  black-mirror:
    # SHIFT+右クリックで設置、通常右クリックで設置地点へ転移。
    cooldown-seconds: 60
