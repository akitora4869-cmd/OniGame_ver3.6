  sweep:
    cooldown-seconds: 16
    radius: 7.0
    angle-degrees: 100.0
    damage: 7.0
  snakefall:
    cooldown-seconds: 45
    count: 30
    spawn-radius: 22.0
    lifetime-seconds: 20
    glow-seconds: 4
  release:
    # 心臓が残り1個の時のみ使用可能。1試合で事実上1回だけの長CT。
    cooldown-seconds: 9999
    exit-seal-seconds: 60
    strength-amplifier: 1
    speed-amplifier: 1
  piercing-blast:
    # 黒の波動: 溜め後、一直線の範囲を複数人まとめて貫く。遮蔽物でも止まらない。
